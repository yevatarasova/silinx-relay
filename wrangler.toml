# A relay of Silinx's shared projects (live sharing) on Cloudflare Workers, one Durable Object per room (#4541).
# Deploy: the README's "Deploy to Cloudflare" button, or `npx wrangler deploy` here; then its key:
# `npx wrangler secret put RELAY_KEY`.
name = "silinx-relay"
main = "src/worker.js"
compatibility_date = "2025-11-01"
# Its address, https://silinx-relay.<subdomain>.workers.dev; no preview addresses (said, so that a deploy warns of
# neither, #4630)
workers_dev = true
preview_urls = false

[vars]
# The Silinx sites whose pages use this relay (their origins, separated by spaces): the Silinx site's by default; add a
# Silinx server's own (http://127.0.0.1:8642) or another site's.
ORIGINS = "https://pmnmalo.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

# (SQLite-backed Durable Objects: the Workers Free plan's; the rooms store nothing)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
